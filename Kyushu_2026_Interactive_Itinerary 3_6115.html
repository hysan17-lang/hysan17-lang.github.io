  const mode=(d.day===1&&i===3)||(d.day===4&&[0,2,3].includes(i))||(d.day===5&&i===0)||(d.day===6&&i===4)||[7,8].includes(d.day)?'walking':travelMode(d);
  const origin=d.day===3?day3Locations[i]:d.day===7?day7Locations[i]:d.day===8?day8Locations[i]:d.day===1&&i===1?'トヨタレンタカー 福岡INTERNATIONAL店 福岡市博多区東那珂2丁目22-3':point(a);
  const destination=d.day===3?day3Locations[i+1]:d.day===7?day7Locations[i+1]:d.day===8?day8Locations[i+1]:point(b);

const routeFor=d=>{
  const p=d.route.split('|');
  const q=new URLSearchParams({api:'1',travelmode:'driving',origin:p[0],destination:p[p.length-1]});
  if(p.length>2)q.set('waypoints',p.slice(1,-1).join('|'));
  return `https://www.google.com/maps/dir/?${q}`;
};

function taxStore(s){
  const badges={'cash-now':['即場預支現金','cash-now'],'cash-airport':['可選機場現金','cash-airport'],noncash:['官方列非現金','noncash'],ask:['現金需向店舖確認','cash-ask']};
  const [label,cls]=badges[s.refund];
  const map=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.map)}`;
  return `<article class="tax-store"><div class="tax-store-head"><div><span>${esc(s.type)}</span><h3>${esc(s.name)}</h3></div><b class="tax-badge ${cls}">${label}</b></div><p class="tax-place">📍 ${esc(s.place)}</p><p>${esc(s.method)}</p><div class="links">${linkUnit(s.link,'🔗 店舖／免稅官方資料 ↗')}${s.extra?linkUnit(s.extra,'🔗 第二間店官方資料 ↗'):''}${linkUnit(map,'📍 地圖 ↗')}</div></article>`;
}
function viewTaxFree(area='all'){
  const g=window.KYUSHU_TAX_FREE,areas={all:'全部',hakata:'博多',tenjin:'天神',yakuin:'藥院'};
  content.innerHTML=`<div class="tax-guide"><div class="tax-hero"><span class="eyebrow">KYUSHU 2026 · SHOPPING</span><h2>💴 日本購物退稅指南</h2><p>博多、天神、藥院周邊購物與福岡機場離境流程。以日圓現金為優先，但退款方式由購買店舖及服務商決定；付款前先問，並查看手續費。</p><strong>11月1日起新制度：店內先付含稅價 → 購物當天辦免稅登記 → 11月22日在福岡機場海關確認 → 才完成退款。</strong><small>資料核對：${esc(g.updated)}；各分店退稅資格、返款方式及營業時間以購買當日為準。</small></div>
  <section class="tax-warning"><strong>先記住這四點</strong><ol><li>一般門檻為同一店同一日稅前合計 ¥5,000 或以上；指定商場共用櫃台可按合資格加盟店規則合算。須是合資格旅客並把商品帶離日本；買藥妝、食品當作退稅商品，離境前不要使用或吃掉。</li><li>店內要掃護照或免稅 QR，按店方要求於購物當日登記。一般購物收據不能留待機場才辦成退稅。</li><li>可選現金也可能有店方、服務商及機場現金手續費；請問「最後實收日圓」及退稅服務商名稱。沒有店方現金選項，機場櫃台不能代你改成現金。</li><li>11月22日 CX589 預定 16:35 起飛，原行程約 13:30 到機場；如購物多或要領現金，建議提前抵達，先完成海關確認再排隊寄艙。</li></ol></section>
  <section class="tax-cash"><h3>💴 現金優先：先去邊間？</h3><div class="tax-cash-grid"><div><b>① 博多 Yodobashi</b><p>可在指定店櫃台即場預支現金；需信用卡作保證，離境時仍要做海關確認。適合想在旅途中先拿到日圓現金。</p></div><div><b>② 博多阪急</b><p>官方列機場現金選項；購買當日先到 JR 博多城 2F 共用櫃台辦理，確認福岡機場適用及額外費用。出境後在指定櫃台領現金。</p></div><div><b>③ 其他店先查</b><p>天神百貨及部分商場的官方指引只列信用卡或電子支付；藥妝及 Bic 的現金安排未核實。不要只看「Tax Free」標誌便假設可領現金。</p></div></div></section>
  <section class="tax-shops"><div class="tax-section-head"><h3>🛍️ 商店退稅方法</h3><p>按地區查看；「現金需確認」代表店舖有免稅資訊，但未核實這間分店能否以現金退款。</p></div><div class="tax-filters" role="group" aria-label="購物地區">${Object.entries(areas).map(([key,title])=>`<button type="button" class="tax-filter" data-tax-area="${key}" aria-pressed="${area===key}">${title}</button>`).join('')}</div><div class="tax-store-grid">${g.stores.filter(s=>area==='all'||s.area===area).map(taxStore).join('')}</div></section>
  <section class="tax-airport"><h3>✈️ Day 9 · 福岡機場退稅次序</h3><div class="tax-steps"><div><b>1 · 抵達國際線 3F，先找海關 KIOSK</b><p>南側 J–M 航空櫃台前有 12 部端末，06:00–21:00。帶本人護照、所有申報退稅的商品與收據；務必在交寄行李前處理。</p></div><div><b>2 · 取得 GREEN／RED 判定</b><p>GREEN 即完成海關確認；RED 到旁邊海關確認處，按職員指示展示商品。也可在 3F 指定區接上專用 Wi‑Fi，以 Visit Japan Web 辦理；未能使用便用 KIOSK。</p></div><div><b>3 · 寄艙、安檢和出境</b><p>完成海關確認才把商品放入行李寄艙。不要先寄艙再掃護照；出境後亦不能返回出發大堂補辦。</p></div><div><b>4 · 領日圓現金（只限已選兼容現金者）</b><p>通過出境檢查後，國際線 3F 免稅店區「HAKATA FOOD HALL」入口旁的退款端末／櫃台；端末 06:00–21:00，櫃台 07:00–21:00。依店舖交給你的退款憑證或服務商指示操作，核對實收及費用。</p></div></div><div class="links">${linkUnit('https://www.fukuoka-airport.jp/taxrefund_info.html','🏢 福岡機場官方退稅流程及地圖 ↗')}${linkUnit('https://www.customs.go.jp/kaigairyoko/taxrefund.htm','🛃 日本海關新制度 ↗')}${linkUnit('https://www.mlit.go.jp/kankocho/tax-free/page01_000001_00021.html','📘 觀光廳旅客指南 ↗')}</div></section>
  <section class="tax-phrases"><h3>🗣️ 結帳前可問</h3>${g.phrases.map(([zh,ja,ro])=>`<div><strong>${esc(zh)}</strong><span lang="ja">${esc(ja)}</span><small>${esc(ro)}</small></div>`).join('')}</section></div>`;
}
function drivingGuide(d){
  const g=window.KYUSHU_DRIVING?.[d.day];
  if(!g)return '';
  return `<details class="driving-guide" open><summary>🚗 駕車距離、時間與 ETC 收費</summary><div class="driving-inside"><div class="driving-totals"><div class="driving-total"><strong>全日駕車估算</strong><b>${esc(g.total)}</b></div><div class="driving-total"><strong>高速 ETC 預算</strong><b>${esc(g.toll)}</b></div></div><p class="driving-note">${esc(g.note)}</p><div class="driving-rows">${g.rows.map(([from,km,time,via,fee])=>`<article class="driving-row"><h3>${esc(from)}</h3><p class="drive-metrics">📏 ${esc(km)} · ⏱️ ${esc(time)}</p><p>🛣️ ${esc(via)}</p><p class="drive-fee">💳 ${esc(fee)}</p></article>`).join('')}</div>${g.optional?`<p class="driving-note" style="margin:13px 0 0">${esc(g.optional)}</p>`:''}${g.sources?`<div class="links">${g.sources.map(([label,url])=>linkUnit(url,`🔗 ${esc(label)} ↗`)).join('')}</div>`:''}<p class="drive-small">道路距離與車程是按現有站點的規劃估算，非即時導航結果；純駕車時間不含參觀、泊車及休息。ETC 以普通私家車、所列入口／出口計；改走其他路線或收費方案會不同。出發前請用導航及 NEXCO 按當日時間核對。</p></div></details>`;
}

const weatherDate=d=>`2026-11-${String(d+13).padStart(2,'0')}`;
const compass=degrees=>['北','東北','東','東南','南','西南','西','西北'][Math.round(((degrees%360)+360)%360/45)%8];
const weatherNote=(rain,prob)=>rain>=10&&prob<30?'雨量預報偏高，與機率有落差':rain>=10?'預計雨量較多':prob>=60?'較大機會有雨':prob>=30?'可能有雨':rain>0?'有降雨預測':'雨機會較低';
const weatherTime=ms=>new Intl.DateTimeFormat('zh-Hant-HK',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(ms);
const weatherFooter=(time)=>`<p class="weather-source">讀取時間：${esc(weatherTime(time))}（日本時間） · 來源：<a href="https://open-meteo.com/en/docs" rel="noopener noreferrer">Open-Meteo</a>。雨量是全天預測總量；降雨機率取當日最高值。遠期預報可能不一致或變動，出發前再核對。<button type="button" class="weather-refresh" data-weather-refresh>重新整理</button></p>`;
async function getWeather(key){
  const old=weatherCache.get(key);
  if(old&&Date.now()-old.fetched<45*60*1000)return old;
  const place=weatherPlaces[key],url=new URL('https://api.open-meteo.com/v1/forecast');
  url.search=new URLSearchParams({latitude:place.lat,longitude:place.lon,daily:'temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_direction_10m_dominant',timezone:'Asia/Tokyo',forecast_days:'16'});
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
  try{
    const response=await fetch(url,{signal:controller.signal});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    const json=await response.json();
    if(!Array.isArray(json.daily?.time))throw new Error('無預報資料');
    const result={daily:json.daily,fetched:Date.now()};
    weatherCache.set(key,result);return result;
  }finally{clearTimeout(timer)}
}
function weatherLine(key,day,result){
  const name=weatherPlaces[key].name;
  if(result.status==='rejected')return `<div class="weather-place"><strong>${name}</strong><span>暫時無法讀取預報</span></div>`;
  const {daily}=result.value,i=daily.time.indexOf(weatherDate(day));
  if(i<0)return `<div class="weather-place"><strong>${name}</strong><span>暫未有這天的預報</span></div>`;
  const hi=daily.temperature_2m_max[i],lo=daily.temperature_2m_min[i],rain=daily.precipitation_sum[i],prob=daily.precipitation_probability_max[i],wind=daily.wind_speed_10m_max[i],direction=daily.wind_direction_10m_dominant[i];
  if(![hi,lo,rain,prob,wind,direction].every(Number.isFinite))return `<div class="weather-place"><strong>${name}</strong><span>預報資料未齊</span></div>`;
  return `<div class="weather-place"><strong>${name}</strong><span class="weather-temp">${Math.round(lo)}–${Math.round(hi)}°C</span><span>🌬️ ${compass(direction)}風 · 最大 ${Math.round(wind)} km/h</span><span>☔ ${weatherNote(rain,prob)} · 最高降雨機率 ${Math.round(prob)}% · 雨量 ${rain.toFixed(1)} mm</span></div>`;
}
async function renderWeather(day){

    button.textContent='✓ 已複製';button.setAttribute('aria-label','已複製');
    setTimeout(()=>{button.textContent=label;button.setAttribute('aria-label',aria)},2500);
  }catch{
    const body=document.getElementById('dialog-body');
    body.innerHTML=`<h2 id="dialog-title">複製資料</h2><p>請選取以下內容複製：</p><input class="url-fallback" value="${esc(url)}" readonly>`;
    dialog.showModal();
    body.querySelector('input').select();
  }
}
